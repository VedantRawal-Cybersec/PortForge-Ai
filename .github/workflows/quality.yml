name: PortForge quality gate
on:
  push:
    branches: [main, feat/commercial-platform-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # TODO: regenerate and commit package-lock.json, then restore npm ci for immutable CI builds.
      - name: Protect customer-neutral UI
        run: node tests/no-owner-showcase.cjs
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: npm run test
      - name: Production bundle
        run: npm run build
      - name: Browser regression tests
        timeout-minutes: 6
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          # GitHub hosted Ubuntu already provides Chromium shared libraries. Avoid apt package updates,\n          # which can hang on unreliable package mirrors and mask a healthy application build.\n          npx playwright install chromium
          node tests/smoke.cjs
